<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Comic: a signed indexing offer arrives with a deadline, the dipper terminal counts it down, and the indexer that accepts on-chain gets paid by the Big Dipper while the potato's offer expires">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120E2E"/>
      <stop offset="52%" stop-color="#3A22A6"/>
      <stop offset="100%" stop-color="#6747ED"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="190" rx="16"/></clipPath>
    <clipPath id="panel3"><rect x="810" y="16" width="360" height="158" rx="12"/></clipPath>
    <!-- a friendly indexer bot: antenna, screen face, sturdy legs -->
    <g id="bot">
      <line x1="0" y1="-26" x2="0" y2="-33" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
      <circle cx="0" cy="-36" r="2.6" fill="#FFD98A" fill-opacity="0.95"/>
      <rect x="-14" y="-26" width="28" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.93"/>
      <circle cx="-5" cy="-16" r="2" fill="#3A22A6"/>
      <circle cx="5" cy="-16" r="2" fill="#3A22A6"/>
      <path d="M-5,-10 Q0,-6 5,-10" fill="none" stroke="#3A22A6" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-8" y="-3" width="16" height="7" rx="2" fill="#3A22A6" fill-opacity="0.3"/>
      <line x1="-6" y1="8" x2="-6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="8" x2="6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <!-- a sealed offer: envelope with a wax seal and a ticking clock badge -->
    <g id="offer">
      <rect x="-22" y="-14" width="44" height="30" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
      <path d="M-22,-12 L0,4 L22,-12" fill="none" stroke="#3A22A6" stroke-width="1.8" stroke-opacity="0.7"/>
      <circle cx="0" cy="2" r="5.5" fill="#FFB86B" fill-opacity="0.95"/>
      <path d="M-2.4,2 L2.6,2 M0,-0.6 L0,2" stroke="#7A3A00" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="17" cy="-11" r="7" fill="#0B0725" fill-opacity="0.92" stroke="#FFD98A" stroke-opacity="0.9" stroke-width="1.4"/>
      <path d="M17,-15 L17,-11 L20,-9.4" fill="none" stroke="#FFD98A" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="190" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#frame)">

    <!-- ======================= panel 1: the offer arrives ======================= -->
    <rect x="30" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g>
      <!-- the dipper, a little ladle-badged courier console on the left -->
      <rect x="52" y="52" width="76" height="56" rx="8" fill="#0B0725" fill-opacity="0.92" stroke="#B7A6FF" stroke-opacity="0.4" stroke-width="1.4"/>
      <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.3">
        <line x1="66" y1="72" x2="78" y2="68"/>
        <line x1="78" y1="68" x2="90" y2="72"/>
        <line x1="90" y1="72" x2="88" y2="82"/>
        <line x1="88" y1="82" x2="76" y2="82"/>
        <line x1="76" y1="82" x2="66" y2="72"/>
        <line x1="90" y1="72" x2="102" y2="66"/>
        <line x1="102" y1="66" x2="114" y2="62"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="66" cy="72" r="1.8" fill-opacity="0.95"/>
        <circle cx="78" cy="68" r="1.8" fill-opacity="0.95"/>
        <circle cx="90" cy="72" r="1.8" fill-opacity="0.95"/>
        <circle cx="88" cy="82" r="1.8" fill-opacity="0.95"/>
        <circle cx="76" cy="82" r="1.8" fill-opacity="0.95"/>
        <circle cx="102" cy="66" r="1.8" fill-opacity="0.95"/>
        <circle cx="114" cy="62" r="1.8" fill-opacity="0.95"/>
      </g>
      <text x="90" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#B7A6FF" fill-opacity="0.8">dipper</text>

      <!-- the offer, en route -->
      <path d="M136,80 Q190,64 244,84" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round"/>
      <g transform="translate(196,70) rotate(-6)">
        <use href="#offer"/>
      </g>

      <!-- the indexer bot, catching it -->
      <g transform="translate(300,112) scale(0.95)">
        <line x1="13" y1="-8" x2="24" y2="-18" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="25" cy="-20" r="3" fill="#FFFFFF" fill-opacity="0.95"/>
        <use href="#bot"/>
      </g>
      <text x="210" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.5">a signed offer, sealed with a deadline</text>
    </g>

    <!-- ======================= panel 2: the clock is ticking ======================= -->
    <rect x="420" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g>
      <!-- the dipper console -->
      <rect x="442" y="34" width="280" height="106" rx="10" fill="#0B0725" fill-opacity="0.92" stroke="#B7A6FF" stroke-opacity="0.4" stroke-width="1.4"/>
      <line x1="442" y1="58" x2="722" y2="58" stroke="#B7A6FF" stroke-opacity="0.25" stroke-width="1.2"/>
      <circle cx="459" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="473" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <circle cx="487" cy="46" r="3.8" fill="#FFFFFF" fill-opacity="0.22"/>
      <text x="710" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B7A6FF" fill-opacity="0.55">dipper@gateway:~</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CFC5FF" fill-opacity="0.85">
        <text x="458" y="76">$ dipper offer Qmf00…9aa</text>
        <text x="458" y="94">sent to ........ 0x7de1…</text>
        <text x="458" y="112">accepted ....... waiting</text>
        <text x="458" y="130">expires in ..... <tspan fill="#FFB86B" font-weight="bold">09:59</tspan><tspan fill="#CFC5FF" fill-opacity="0.5"> ▌</tspan></text>
      </g>
      <!-- the potato, sitting on its own unopened offer -->
      <g transform="translate(752,118) rotate(4) scale(0.8)">
        <g transform="translate(2,22) rotate(-8) scale(0.9)"><use href="#offer"/></g>
        <path d="M-30,2 C-32,-12 -14,-22 2,-20 C20,-19 32,-8 29,6 C26,18 8,24 -8,21 C-22,19 -28,12 -30,2 Z" fill="#C79A5B" stroke="#7A5A33" stroke-width="2"/>
        <ellipse cx="-12" cy="-8" rx="2.6" ry="1.8" fill="#8F6A3D" fill-opacity="0.6"/>
        <ellipse cx="14" cy="6" rx="2.4" ry="1.7" fill="#8F6A3D" fill-opacity="0.6"/>
        <path d="M-9,-3 Q-6,-6 -3,-3" fill="none" stroke="#3A2A15" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M3,-3 Q6,-6 9,-3" fill="none" stroke="#3A2A15" stroke-width="1.7" stroke-linecap="round"/>
        <text x="34" y="-14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FFFFFF" fill-opacity="0.6">z</text>
      </g>
      <text x="600" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.5">accept on-chain before it expires</text>
    </g>

    <!-- ======================= panel 3: the verdict, split ======================= -->
    <rect x="810" y="16" width="360" height="158" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.3"/>
    <g clip-path="url(#panel3)">
      <!-- dark expired side / bright paid side -->
      <rect x="810" y="16" width="176" height="158" fill="#0A0620" fill-opacity="0.4"/>
      <rect x="986" y="16" width="184" height="158" fill="#B7A6FF" fill-opacity="0.1"/>
      <line x1="986" y1="22" x2="986" y2="168" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="6 6"/>

      <!-- the Big Dipper, tipped over, pouring GRT -->
      <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.1">
        <line x1="1042" y1="66" x2="1064" y2="46"/>
        <line x1="1064" y1="46" x2="1092" y2="52"/>
        <line x1="1092" y1="52" x2="1086" y2="76"/>
        <line x1="1086" y1="76" x2="1052" y2="82"/>
        <line x1="1052" y1="82" x2="1042" y2="66"/>
        <line x1="1092" y1="52" x2="1118" y2="40"/>
        <line x1="1118" y1="40" x2="1148" y2="34"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="1042" cy="66" r="6" fill-opacity="0.09"/><circle cx="1042" cy="66" r="2.8" fill-opacity="0.95"/>
        <circle cx="1064" cy="46" r="6" fill-opacity="0.09"/><circle cx="1064" cy="46" r="2.8" fill-opacity="0.95"/>
        <circle cx="1092" cy="52" r="6" fill-opacity="0.09"/><circle cx="1092" cy="52" r="2.8" fill-opacity="0.95"/>
        <circle cx="1086" cy="76" r="6" fill-opacity="0.09"/><circle cx="1086" cy="76" r="2.8" fill-opacity="0.95"/>
        <circle cx="1052" cy="82" r="6" fill-opacity="0.09"/><circle cx="1052" cy="82" r="2.8" fill-opacity="0.95"/>
        <circle cx="1118" cy="40" r="6" fill-opacity="0.09"/><circle cx="1118" cy="40" r="2.8" fill-opacity="0.95"/>
        <circle cx="1148" cy="34" r="6" fill-opacity="0.09"/><circle cx="1148" cy="34" r="2.8" fill-opacity="0.95"/>
      </g>
      <!-- the pour: a stream of GRT sparkles into the mug -->
      <g fill="#FFD98A">
        <path d="M1047,94 L1048.2,97.4 L1051.4,98.6 L1048.2,99.8 L1047,103.2 L1045.8,99.8 L1042.6,98.6 L1045.8,97.4 Z" fill-opacity="0.9"/>
        <path d="M1043,108 L1044,111 L1047,112 L1044,113 L1043,116 L1042,113 L1039,112 L1042,111 Z" fill-opacity="0.75"/>
        <path d="M1040,120 L1040.8,122.4 L1043.2,123.2 L1040.8,124 L1040,126.4 L1039.2,124 L1036.8,123.2 L1039.2,122.4 Z" fill-opacity="0.6"/>
      </g>
      <!-- the indexer, mug out -->
      <g transform="translate(1062,124) scale(0.9)">
        <use href="#bot"/>
        <line x1="-13" y1="-6" x2="-24" y2="2" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
        <rect x="-34" y="0" width="14" height="12" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/>
        <path d="M-34,3 q-5,3 0,6" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2"/>
        <path d="M-31,-2 L-30.2,0.4 L-27.8,1.2 L-30.2,2 L-31,4.4 L-31.8,2 L-34.2,1.2 L-31.8,0.4 Z" fill="#FFD98A" fill-opacity="0.95"/>
      </g>
      <text x="1122" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#B7A6FF" fill-opacity="0.85">GRT/sec</text>

      <!-- the expired side: the potato and its cobwebbed offer -->
      <g fill="#FFFFFF">
        <circle cx="836" cy="44" r="1.1" fill-opacity="0.3"/>
        <circle cx="884" cy="30" r="1.0" fill-opacity="0.25"/>
        <circle cx="922" cy="60" r="1.1" fill-opacity="0.25"/>
      </g>
      <g transform="translate(886,96) rotate(-8)">
        <use href="#offer"/>
        <text x="0" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#FFB86B" fill-opacity="0.9" font-weight="bold">EXPIRED</text>
      </g>
      <g transform="translate(940,134) rotate(-5) scale(0.75)">
        <path d="M-30,2 C-32,-12 -14,-22 2,-20 C20,-19 32,-8 29,6 C26,18 8,24 -8,21 C-22,19 -28,12 -30,2 Z" fill="#C79A5B" stroke="#7A5A33" stroke-width="2"/>
        <ellipse cx="-12" cy="-8" rx="2.6" ry="1.8" fill="#8F6A3D" fill-opacity="0.6"/>
        <ellipse cx="14" cy="6" rx="2.4" ry="1.7" fill="#8F6A3D" fill-opacity="0.6"/>
        <circle cx="-8" cy="-4" r="1.9" fill="#3A2A15"/>
        <circle cx="4" cy="-4" r="1.9" fill="#3A2A15"/>
        <ellipse cx="-2" cy="7" rx="3" ry="3.8" fill="none" stroke="#3A2A15" stroke-width="1.6"/>
        <path d="M20,-16 q3,-5 0,-8 q-3,3 0,8" fill="#9FD0FF" fill-opacity="0.9"/>
      </g>

      <!-- verdict labels -->
      <text x="826" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFB86B" fill-opacity="0.8">slept on it</text>
      <text x="1154" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.6">accepted on-chain</text>
    </g>
  </g>
</svg>
